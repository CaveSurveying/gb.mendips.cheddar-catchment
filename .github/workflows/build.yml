# Build the 3D views from the data, with cave-viewer's
# reusable workflow. The repository is private, so the site isn't
# published: it's attached to the run (the github-pages artifact) to
# download and look at. To publish it, set deploy: true and turn on
# Pages (Settings > Pages > Source: GitHub Actions); on a private
# repository that needs a paid plan, and makes the site public.
name: Build the 3D views
# Run by hand (Actions tab, Run workflow), so a failing run sends no email.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write        # (asked for by the reusable workflow's deploy job, which is off)
  id-token: write

jobs:
  site:
    uses: CaveSurveying/cave-viewer/.github/workflows/build.yml@v0.6.1
    with:
      config: caves.json
      apt-packages: therion survex
      deploy: false
