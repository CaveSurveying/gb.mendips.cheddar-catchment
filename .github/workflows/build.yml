# Build the 3D view with cave-viewer's reusable workflow and publish it
# to GitHub Pages. The LiDAR isn't kept in the repository: the build
# fetches it from the Environment Agency, and Actions keeps it in its
# cache between runs.
#
# Run by hand (Actions tab, Run workflow) for now. Pages needs turning on
# first: Settings > Pages > Source: GitHub Actions.
name: Build the 3D view
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  site:
    uses: CaveSurveying/cave-viewer/.github/workflows/build.yml@v0.6.0
    with:
      config: caves.json
      apt-packages: therion survex
      deploy: true
